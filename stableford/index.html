<div class="wrap" id="app"></div>

<script>
/* ============================================================
   CONFIG — paste your two Supabase values here.
   Supabase dashboard > Project Settings > API Keys (older projects: Settings > API):
     SUPABASE_URL      = the Project URL, e.g. "https://abcdefgh.supabase.co"
     SUPABASE_ANON_KEY = the "anon public" key (eyJ...) or the "Publishable" key (sb_publishable_...)
   Leave both blank and the page runs on this phone only.
   ============================================================ */
const SUPABASE_URL="https://ogcqhwciymidxkjmejea.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Xs5Fid2D8rkIvMr6lrC61w_AYP93zy7";

/* ============================================================
   STORE — the only place that reads or writes data.
   Live mode: Supabase tables "players" (id, name, hcp, sort) and
   "scores" (player_id, hole, strokes), with realtime so every phone
   updates within a second. Local mode: this phone's browser storage.
   Nothing outside this block touches storage.
   ============================================================ */
const STORE_KEY="wdde-golf-v4";  // v4 = clean slate; older saves are wiped
const DEFAULT_NAMES=["AB","Brocky","Don","Gilly","Joey","JT","Locky","Rocket","Shark","Wally"];
const blankHoles=()=>Array(18).fill(null);
let MODE="local", SB=null, syncNote="Saved on this phone only.";
function defaultState(){return{players:DEFAULT_NAMES.map((n,i)=>({id:"p"+(i+1),name:n,hcp:null,sort:i+1,holes:blankHoles()}))}}
function loadLocal(){
  try{
    ["wdde-golf-v1","wdde-golf-v2","wdde-golf-v3"].forEach(k=>localStorage.removeItem(k));
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.players)){s.players.forEach(p=>{if(!Array.isArray(p.holes)||p.holes.length!==18)p.holes=blankHoles()});return s}}
  }catch(e){}
  return defaultState();
}
function saveLocal(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}
function liveFailed(msg){MODE="local";syncNote=msg;saveLocal();render()}
async function fetchAll(){
  const [pl,sc]=await Promise.all([
    SB.from("players").select("id,name,hcp,sort").order("sort"),
    SB.from("scores").select("player_id,hole,strokes")]);
  if(pl.error||sc.error)throw (pl.error||sc.error);
  const players=pl.data.map(r=>({id:r.id,name:r.name,hcp:r.hcp==null?null:Number(r.hcp),sort:r.sort,holes:blankHoles()}));
  const by=Object.fromEntries(players.map(p=>[p.id,p]));
  sc.data.forEach(r=>{const p=by[r.player_id];if(p&&r.hole>=1&&r.hole<=18)p.holes[r.hole-1]=r.strokes});
  return{players};
}
async function startStore(){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY)return;
  if(!window.supabase){syncNote="Couldn't load the live sync library. Saved on this phone only.";render();return}
  try{
    SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const s=await fetchAll();
    MODE="live";syncNote="Live: scores sync across everyone's phones.";
    onRemoteChange(s);
    SB.channel("wdde-golf")
      .on("postgres_changes",{event:"*",schema:"public",table:"scores"},applyScoreEvent)
      .on("postgres_changes",{event:"*",schema:"public",table:"players"},applyPlayerEvent)
      .subscribe(st=>{if(st==="SUBSCRIBED"){syncNote="Live: scores sync across everyone's phones.";resync()}
        else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"){syncNote="Live connection dropped. Retrying… scores still save.";rerender()}});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)resync()});
  }catch(e){liveFailed("Can't reach the live board right now. Saved on this phone only.")}
}
async function resync(){if(MODE!=="live")return;try{onRemoteChange(await fetchAll())}catch(e){}}
function applyScoreEvent(ev){
  const r=ev.eventType==="DELETE"?ev.old:ev.new;const p=state.players.find(x=>x.id===r.player_id);if(!p||!r.hole)return;
  p.holes[r.hole-1]=ev.eventType==="DELETE"?null:r.strokes;rerender();
}
function applyPlayerEvent(ev){
  if(ev.eventType==="DELETE"){state.players=state.players.filter(p=>p.id!==ev.old.id);rerender();return}
  const r=ev.new;let p=state.players.find(x=>x.id===r.id);
  if(!p){p={id:r.id,holes:blankHoles()};state.players.push(p)}
  p.name=r.name;p.hcp=r.hcp==null?null:Number(r.hcp);p.sort=r.sort;
  state.players.sort((a,b)=>(a.sort||0)-(b.sort||0));rerender();
}
const timers={};
function debounce(key,fn,ms=400){clearTimeout(timers[key]);timers[key]=setTimeout(fn,ms)}
/* Writes retry until they land (patchy signal on the course). A newer edit to the same box replaces an older pending one. */
const pending={};
const LIVE_NOTE="Live: scores sync across everyone's phones.";
function persist(key,meta,op){
  const ver=(pending[key]?pending[key].ver:0)+1; pending[key]=Object.assign({ver},meta);
  (async()=>{
    for(;;){
      if(!pending[key]||pending[key].ver!==ver)return;
      let error=null; try{({error}=await op())}catch(e){error=e}
      if(!error){
        if(pending[key]&&pending[key].ver===ver)delete pending[key];
        if(!Object.keys(pending).length&&!syncNote.startsWith("Live")){syncNote=LIVE_NOTE;rerender()}
        return;
      }
      syncNote="No signal? Your scores are kept on this phone and will send by themselves.";rerender();
      await new Promise(r=>setTimeout(r,4000));
    }
  })();
}
function warn(e){if(e){syncNote="Last change didn't reach the live board. Check signal and try again.";rerender()}}
function savePlayer(p){
  if(MODE!=="live")return saveLocal();
  debounce("p"+p.id,()=>persist("p"+p.id,{},()=>SB.from("players").upsert({id:p.id,name:p.name,hcp:p.hcp,sort:p.sort||0})));
}
function saveHole(p,i){
  if(MODE!=="live")return saveLocal();
  debounce("h"+p.id+i,()=>persist("h"+p.id+"-"+i,{pid:p.id,i,get v(){return p.holes[i]}},()=>{
    const v=p.holes[i];
    return v==null?SB.from("scores").delete().match({player_id:p.id,hole:i+1})
      :SB.from("scores").upsert({player_id:p.id,hole:i+1,strokes:v});
  }),250);
}
async function addPlayer(p){
  p.sort=Math.max(0,...state.players.map(x=>x.sort||0))+1;
  if(MODE!=="live")return saveLocal();
  const{error}=await SB.from("players").insert({id:p.id,name:p.name,hcp:null,sort:p.sort});warn(error);
}
async function removePlayerFromStore(id){
  if(MODE!=="live")return saveLocal();
  const{error}=await SB.from("players").delete().eq("id",id);warn(error);
}
async function clearAllScores(){
  state.players.forEach(p=>p.holes=blankHoles());
  if(MODE!=="live")return saveLocal();
  const{error}=await SB.from("scores").delete().gte("hole",1);warn(error);
}
function onRemoteChange(newState){
  /* keep scores this phone hasn't managed to send yet */
  Object.values(pending).forEach(m=>{if(m.pid==null)return;const p=newState.players.find(x=>x.id===m.pid);if(p)p.holes[m.i]=m.v});
  state=newState;rerender()}
/* ======================= end STORE ======================= */

/* Palmer Colonial — white tees, par 72, 5,774 m */
const COURSE={name:"Palmer Colonial",tees:"White tees",holes:[
 [357,4,"Mid-length par 4. A drive in play leaves a mid iron in."],
 [436,5,"Short par 5. Two solid hits and a wedge gives you a birdie look."],
 [335,4,"Shorter par 4. Put it in the fairway first; length matters less here."],
 [145,3,"Short par 3. Take enough club to reach the middle of the green."],
 [338,4,"Mid-length par 4. A fairway off the tee and a short iron in."],
 [311,4,"Short par 4. A hybrid or wood off the tee still leaves a wedge."],
 [129,3,"Shortest hole on the course. Short iron at the fat of the green."],
 [449,5,"Par 5. Three sensible shots beat one big swing."],
 [380,4,"Longest par 4 on the front. Bogey is no disaster here."],
 [336,4,"Mid-length par 4. Fairway first, then a short iron."],
 [452,5,"Par 5. Lay up to your favourite wedge distance."],
 [174,3,"Longest par 3. Take plenty of club; missing short is common."],
 [338,4,"Mid-length par 4. Keep the driver in play and you're attacking."],
 [306,4,"Shortest par 4. Position off the tee for a full wedge."],
 [337,4,"Mid-length par 4. Another fairway-and-short-iron hole."],
 [147,3,"Short par 3. Middle of the green and two putts is a good score."],
 [484,5,"Longest hole on the course. Three shots, no heroics."],
 [320,4,"Short closing par 4. Finish with a fairway and a wedge."]
]};
const CTP=-1; /* closest-to-the-pin hole, 0-based (e.g. 15 = hole 16); -1 = off, the course runs it on the day */
const PAR=COURSE.holes.map(h=>h[1]), TOTAL_PAR=PAR.reduce((a,b)=>a+b,0);
/* Men's stroke index, white tees (1 = hardest). Source: Swing by Swing / GolfPass / mScorecard, checked 10 Oct 2026. */
const SI=[5,17,7,15,1,9,13,11,3,16,18,2,6,14,4,12,8,10];
/* Handicap strokes on hole i: a 12 gets one shot on index 1-12; a 20 gets one everywhere plus a second on index 1-2. Handicap rounds to a whole number. */
function shots(hcp,i){
  const h=Math.round(hcp||0), n=Math.abs(h), base=Math.floor(n/18), extra=n%18;
  if(h>=0)return base+(SI[i]<=extra?1:0);
  return -(base+(SI[i]>18-extra?1:0)); /* plus handicap gives shots back on the easiest holes */
}
/* WDDE Club logo — same artwork as the Cup Day form guide */

  <g class="fig">
    <circle cx="46" cy="58" r="17"/><rect x="39" y="68" width="14" height="16"/><rect x="16" y="78" width="60" height="116" rx="22"/>
    <circle cx="98" cy="44" r="17"/><rect x="91" y="54" width="14" height="16"/><rect x="68" y="64" width="60" height="130" rx="22"/>
    <circle cx="150" cy="32" r="18"/><rect x="143" y="43" width="14" height="16"/><rect x="119" y="53" width="62" height="141" rx="22"/>
    <circle cx="202" cy="44" r="17"/><rect x="195" y="54" width="14" height="16"/><rect x="172" y="64" width="60" height="130" rx="22"/>
    <circle cx="254" cy="58" r="17"/><rect x="247" y="68" width="14" height="16"/><rect x="224" y="78" width="60" height="116" rx="22"/>
  </g>
  <g class="gap">
    <path d="M44 194 L46 156 L48 194Z"/><path d="M96 194 L98 156 L100 194Z"/><path d="M148 194 L150 152 L152 194Z"/><path d="M200 194 L202 156 L204 194Z"/><path d="M252 194 L254 156 L256 194Z"/>
    <path d="M71 194 L72 176 L73 194Z"/><path d="M124 194 L125 172 L126 194Z"/><path d="M175 194 L176 172 L177 194Z"/><path d="M228 194 L229 176 L230 194Z"/>
  </g>
  <text class="txt" x="150" y="128" text-anchor="middle" font-size="58" textLength="238" lengthAdjust="spacingAndGlyphs">WDDE Club</text>
</svg>`;

/* Player headshots: drop a square photo at faces/<player id>.jpg and list the id here. No photo = initials badge. */
/* Form guide blurbs shown on each player's card (from Steve). */
const BIOS={
  p1:"Arrives fit and fresh. Main target is the 19th hole.",
  p2:"Loves a heavy track. Expect him in the wet.",
  p3:"Top seed. Hard to beat in a weak field, and this is a very weak field.",
  p4:"Expect him to be pushing up the leaderboard.",
  p5:"Sponsored by Just For Men. Chestnut locks in career-best form. Can the golf match?",
  p6:"Long-time NSW and Bears supporter. Hardened by years of disappointment, could serve him well.",
  p7:"Running without the aid of the supercomputer, will have to rely on pure skill alone.",
  p8:"Racing dry this campaign. Untested in these conditions.",
  p9:"Genuine contender. Scratches if he's let near the rum & sars.",
  p10:"Nobody can explain it, but he's always at the top of the leaderboard. Stewards are watching."
};
const FACES={p1:2,p2:1,p3:1,p4:2,p5:1,p6:1,p7:1,p8:1,p9:1,p10:1};
function avatar(p,cls=""){
  const ini=esc((p.name||"?").replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase()||"?");
  return FACES[p.id]?`<img class="av ${cls}" src="../faces/${p.id}.jpg?v=${FACES[p.id]}" alt="">`:`<span class="av ${cls}" aria-hidden="true">${ini}</span>`;
}
let state=loadLocal();
const posMemo={}; /* id -> {pos, mv, at}: places moved at the last change in standings; shown for MOVE_MS */
const MOVE_MS=120000;
setInterval(()=>{if(view.name==="board"&&Object.values(posMemo).some(m=>m.mv&&Date.now()-m.at>=MOVE_MS&&!m.gone)){Object.values(posMemo).forEach(m=>{if(m.mv&&Date.now()-m.at>=MOVE_MS)m.gone=true});rerender()}},10000);
let view={name:"board",id:null,edit:false}, prevOrder=[];
const $=id=>document.getElementById(id);
const num=v=>{if(v===""||v==null)return null;const n=parseInt(v,10);return isNaN(n)||n<1?null:Math.min(n,20)};
const numDec=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n};
const fmt=n=>n==null?"–":(Number.isInteger(n)?String(n):n.toFixed(1));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=(a,f,t)=>a.slice(f,t).reduce((s,v)=>s+(v||0),0);
function holePts(p,i){const v=p.holes[i];return v==null?null:Math.max(0,2+PAR[i]-(v-shots(p.hcp,i)))}
function stats(p){
  const played=p.holes.map((v,i)=>v!=null?i:-1).filter(i=>i>=0);
  const gross=played.length?sum(p.holes,0,18):null;
  const parPlayed=played.reduce((s,i)=>s+PAR[i],0);
  /* Net to par: handicap strokes are taken on the holes played, by stroke index, as on a real card. */
  const netExact=gross==null?null:gross-parPlayed-played.reduce((s,i)=>s+shots(p.hcp,i),0);
  /* Stableford: 2 points for a net par, +1 per shot better, -1 per shot worse, never below 0. */
  const pts=played.reduce((s,i)=>s+holePts(p,i),0);
  return{thru:played.length,gross,toPar:gross==null?null:gross-parPlayed,netExact,net:netExact==null?null:Math.round(netExact),pts};
}
const toParTxt=n=>n==null?"–":n===0?"E":(n>0?"+"+n:String(n));
const toParCls=n=>n==null||n===0?"":n<0?"under":"over";
function mark(score,par){
  if(score==null)return"";const d=score-par;
  const c=d<=-2?"eagle":d===-1?"birdie":d===1?"bogey":d>=2?"dbl":"";
  return `<span class="mk ${c}">${score}</span>`;
}

/* ---------- views ---------- */
function render(){
  if(view.name==="card"&&!state.players.find(p=>p.id===view.id))view={name:"board",id:null,edit:false};
  if(view.name==="board")renderBoard();else if(view.name==="card")renderCard();else renderSetup();
}
function renderBoard(){
  const list=state.players.map(p=>Object.assign({p},stats(p)));
  const scored=list.filter(x=>x.gross!=null).sort((a,b)=>b.pts-a.pts||a.thru-b.thru);
  const rest=list.filter(x=>x.gross==null).sort((a,b)=>a.p.name.localeCompare(b.p.name,"en",{sensitivity:"base"}));
  let pos=0,last=null;scored.forEach((x,i)=>{if(x.pts!==last){pos=i+1;last=x.pts}x.pos=pos});
  scored.forEach(x=>x.label=(scored.filter(y=>y.pos===x.pos).length>1?"T":"")+x.pos);
  scored.forEach(x=>{const m=posMemo[x.p.id];posMemo[x.p.id]=m&&m.pos!==x.pos?{pos:x.pos,mv:m.pos-x.pos,at:Date.now()}:m?Object.assign(m,{pos:x.pos}):{pos:x.pos,mv:0,at:0}});
  const all=scored.concat(rest), order=all.map(x=>x.p.id);
  $("app").innerHTML=`
  <header>
    <div class="brand">${LOGO}<div><h1>Palmer Colonial Classic</h1><p class="tagline">“Where the greens break both ways”</p></div></div>
    <div class="course"><span class="eyebrow sub">${COURSE.tees} · Par ${TOTAL_PAR} · 5,774 m</span></div>
    <p><b>Stableford.</b> Most points wins. Each hole: net par 2 points, net birdie 3, net bogey 1, worse 0. Handicap shots come on the hardest holes ("SI"). Just type your real score; if you pick up, enter any big number. Tap a player to see or enter his card.</p>
  </header>
  <section class="board" aria-label="Leaderboard">
    <div class="board-head"><h2>Leaderboard</h2><span>Par ${TOTAL_PAR} · ${scored.length} of ${state.players.length} started</span></div>
    <table class="tbl">
      <thead><tr><th>Pos</th><th>Player</th><th>Thru</th><th>Gross</th><th>Hcp</th><th>Pts</th></tr></thead>
      <tbody>${all.map((x,i)=>{
        const empty=x.gross==null, lead=!empty&&x.pos===1, pod=!empty&&x.pos<=3?"p"+x.pos:"", mv=empty?0:(m=>m&&m.mv&&Date.now()-m.at<MOVE_MS?m.mv:0)(posMemo[x.p.id]), moved=prevOrder.length&&prevOrder.indexOf(x.p.id)!==i&&!empty;
        return `<tr class="lbrow ${empty?"empty":""} ${lead?"lead":""} ${pod} ${moved?"moved":""}" data-open="${x.p.id}" tabindex="0" role="button" aria-label="Open ${esc(x.p.name)}'s scorecard">
          <td class="pos">${empty?"–":x.label}${mv>0?`<span class="mv up" aria-label="up ${mv}">▲${mv}</span>`:mv<0?`<span class="mv dn" aria-label="down ${-mv}">▼${-mv}</span>`:""}</td>
          <td class="nm"><span class="nmw">${avatar(x.p)}<span>${esc(x.p.name||"(no name)")}<span class="chev">›</span></span></span></td>
          <td class="thru">${x.thru===18?"F":x.thru||"–"}</td>
          <td><span class="${toParCls(x.toPar)}">${fmt(x.gross)}</span></td>
          <td>${x.p.hcp==null?"–":fmt(x.p.hcp)}</td>
          <td class="net">${x.gross==null?"–":x.pts}</td></tr>`}).join("")}</tbody>
    </table>
    <div class="board-foot">Thru = holes entered (F = finished). Gross is coloured against par for the holes played.${MODE==="live"&&syncNote.startsWith("Live")?"":`<br><b class="sync ${MODE}">${syncNote}</b>`}</div>
  </section>
  <div class="links"><button class="btn sec" data-go="setup" type="button">Handicaps &amp; players</button></div>
  <nav class="scoring" aria-label="Scoring method"><span>Scoring:</span><a  href="../">Stroke play</a><a class="on" aria-current="page" href="../stableford/">Stableford</a></nav>`;
  prevOrder=order;
}
function renderCard(){
  const p=state.players.find(x=>x.id===view.id), s=stats(p);
  const out=sum(p.holes,0,9), inn=sum(p.holes,9,18);
  const has=(f,t)=>p.holes.slice(f,t).some(v=>v!=null);
  const stripRow=(f,t,label)=>`<tr><td>${label}</td>${COURSE.holes.slice(f,t).map((h,i)=>`<td class="s" data-jump="${f+i}">${mark(p.holes[f+i],h[1])||"·"}</td>`).join("")}<td class="tot">${has(f,t)?sum(p.holes,f,t):"–"}</td></tr>`;
  const strip=(f,t,lab,totLab)=>`<div class="strip-wrap"><table class="strip">
      <thead><tr><th>${lab}</th>${COURSE.holes.slice(f,t).map((h,i)=>`<th${f+i===CTP?' class="ctp" title="Closest to the pin"':""}>${f+i+1}</th>`).join("")}<th>${totLab}</th></tr></thead>
      <tbody><tr><td>Par</td>${COURSE.holes.slice(f,t).map(h=>`<td>${h[1]}</td>`).join("")}<td class="tot">${PAR.slice(f,t).reduce((a,b)=>a+b,0)}</td></tr>
      ${stripRow(f,t,"Score")}<tr><td>Pts</td>${COURSE.holes.slice(f,t).map((h,i)=>`<td>${p.holes[f+i]==null?"·":holePts(p,f+i)}</td>`).join("")}<td class="tot">${has(f,t)?COURSE.holes.slice(f,t).reduce((a,h,i)=>a+(holePts(p,f+i)||0),0):"–"}</td></tr></tbody></table></div>`;
  const holeRow=i=>{const h=COURSE.holes[i];return `<div class="hole${i===CTP?" ctp":""}" id="hole-${i}">
      <span class="no">${i+1}</span>
      <span class="info"><b>Par ${h[1]} · ${h[0]} m · SI ${SI[i]}${(n=>n>0?` <span class="shot">+${n} shot${n>1?"s":""}</span>`:"")(shots(p.hcp,i))}</b><span>${h[2]}</span>${i===CTP?'<span class="ctpb">⛳ Closest to the pin</span>':""}</span>
      <input id="s-${p.id}-${i}" data-hole="${i}" inputmode="numeric" pattern="[0-9]*" placeholder="–" value="${p.holes[i]??""}" aria-label="Hole ${i+1} score"></div>`};
  $("app").innerHTML=`
  <div class="bar"><button class="back" data-go="board" type="button">‹ Leaderboard</button>
    ${avatar(p,"lg")}<div class="ttl"><h2>${esc(p.name||"(no name)")}</h2>${BIOS[p.id]?`<p class="tform"><b>Form</b> ${esc(BIOS[p.id])}</p>`:""}<small>Hcp ${p.hcp==null?"not set":fmt(p.hcp)} · ${COURSE.tees}</small></div></div>
  <div class="sum">
    <div><b>${s.thru===18?"F":s.thru}</b><span>Thru</span></div>
    <div><b>${fmt(s.gross)}</b><span>Gross</span></div>
    <div><b class="${toParCls(s.toPar)}">${toParTxt(s.toPar)}</b><span>To par</span></div>
    <div><b>${s.thru?s.pts:"–"}</b><span>Points</span></div>
  </div>
  ${strip(0,9,"Out","Out")}${strip(9,18,"In","In")}
  <div class="nine"><h3>Front nine</h3>${[0,1,2,3,4,5,6,7,8].map(holeRow).join("")}
    <div class="subt"><span>Out (par 36)</span><b>${has(0,9)?out:"–"}</b></div></div>
  <div class="nine"><h3>Back nine</h3>${[9,10,11,12,13,14,15,16,17].map(holeRow).join("")}
    <div class="subt"><span>In (par 36)</span><b>${has(9,18)?inn:"–"}</b></div>
    <div class="subt"><span>Total (par ${TOTAL_PAR})</span><b>${fmt(s.gross)}</b></div></div>
  <div class="links"><button class="btn sec" data-go="board" type="button">‹ Back to leaderboard</button></div>`;
}
function renderSetup(){
  $("app").innerHTML=`
  <div class="bar"><button class="back" data-go="board" type="button">‹ Leaderboard</button><div class="ttl"><h2>Handicaps &amp; players</h2><small>Set before tee-off</small></div></div>
  <section class="panel">
    <p class="hint">Enter each player's handicap. Rename, add or remove players here. Removing a player deletes his card.</p>
    ${state.players.map(p=>`<div class="prow"><input class="name" id="n-${p.id}" data-id="${p.id}" data-f="name" value="${esc(p.name)}" aria-label="Player name"><input id="h-${p.id}" data-id="${p.id}" data-f="hcp" inputmode="decimal" placeholder="Hcp" value="${p.hcp??""}" aria-label="Handicap for ${esc(p.name)}"><button class="x" data-del="${p.id}" type="button" aria-label="Remove ${esc(p.name)}">×</button></div>`).join("")}
    <form class="add" id="addForm"><input class="name" id="newName" placeholder="Add a player" autocomplete="off"><button class="btn" type="submit">Add</button></form>
    <div class="links"><button class="btn sec" id="clearAll" type="button">Clear every scorecard</button></div>
  </section>`;
}

/* ---------- events ---------- */
function go(name,id){view={name,id:id||null,edit:false};render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const o=e.target.closest("[data-open]");if(o){go("card",o.dataset.open);return}
  const j=e.target.closest("[data-jump]");if(j){const el=$("hole-"+j.dataset.jump);if(el){el.scrollIntoView({behavior:"smooth",block:"start"});el.querySelector("input").focus({preventScroll:true})}return}
  const d=e.target.closest("[data-del]");
  if(d){
    if(!d.classList.contains("confirm")){d.classList.add("confirm");d.textContent="Remove";setTimeout(()=>{if(d.isConnected){d.classList.remove("confirm");d.textContent="×"}},3000);return}
    const id=d.dataset.del;state.players=state.players.filter(p=>p.id!==id);removePlayerFromStore(id);render();return}
  if(e.target.id==="clearAll"){
    const b=e.target;
    if(!b.dataset.armed){b.dataset.armed="1";b.className="btn danger";b.textContent="Tap again to wipe all 18-hole cards";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.className="btn sec";b.textContent="Clear every scorecard"}},3000);return}
    clearAllScores();render();
  }
});
document.addEventListener("keydown",e=>{const o=e.target.closest&&e.target.closest("[data-open]");if(o&&(e.key==="Enter"||e.key===" ")){e.preventDefault();go("card",o.dataset.open)}});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.hole!=null&&view.name==="card"){
    const p=state.players.find(x=>x.id===view.id),i=+el.dataset.hole;
    p.holes[i]=num(el.value);saveHole(p,i);
    if(el.value.length>=1&&p.holes[i]!=null&&p.holes[i]>1&&i<17){const nx=$(`s-${p.id}-${i+1}`);if(nx&&!nx.value)setTimeout(()=>nx.focus(),50)}
    refreshCardNumbers();return;
  }
  const id=el.dataset.id,f=el.dataset.f;if(!id||!f)return;
  const p=state.players.find(x=>x.id===id);if(!p)return;
  p[f]=f==="name"?el.value:numDec(el.value);savePlayer(p);});
document.addEventListener("submit",e=>{
  if(e.target.id!=="addForm")return;e.preventDefault();
  const n=$("newName").value.trim();if(!n)return;
  const p={id:"p"+Date.now().toString(36),name:n,hcp:null,holes:blankHoles()};
  state.players.push(p);addPlayer(p);render();$("newName").focus();
});
function refreshCardNumbers(){rerender()}
function rerender(){
  const a=document.activeElement, id=a&&a.id&&a.tagName==="INPUT"?a.id:null, val=id?a.value:null, y=window.scrollY;
  render();window.scrollTo(0,y);
  if(id){const el=$(id);if(el){el.value=val;el.focus({preventScroll:true})}}
}
render();startStore();
</script>
