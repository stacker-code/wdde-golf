<style>
/* Layout: one column, three views. Home = clubhouse leaderboard board. Tap a player = his scorecard (scores save as you type). Setup = handicaps and players. Single dark theme by choice. */
:root{
  color-scheme:dark;
  --bg:#0b1a14; --board:#10291f; --row:#14322a; --line:#21483b;
  --cream:#efe9d6; --muted:#9bb5a8; --flag:#f2c230; --red:#e56a5a; --green:#5ed39b; --blue:#7fb4e8;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--cream);font-family:var(--f-body);font-size:15px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 56px}
header{padding-block:20px 12px;display:grid;gap:2px}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--flag)}
h1{font-family:var(--f-display);font-weight:900;font-size:2.3rem;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0;letter-spacing:.06em;text-transform:uppercase}
header p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.brand>div{display:grid;gap:2px;min-width:0}
header .sub{color:var(--muted)}
.brand h1{font-size:clamp(1rem,4.9vw,2rem);line-height:1;white-space:nowrap}
header .tagline{text-align:center;margin:4px 0 0;font-style:italic;color:var(--flag);font-size:clamp(.9rem,3.6vw,1.05rem)}
.logo{width:clamp(68px,19vw,104px);height:auto;flex:none;display:block}
.logo .fig{fill:var(--cream)}
.logo .gap{fill:var(--bg)}
.logo .txt{fill:var(--bg);font-family:var(--f-display);font-weight:900}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.lbrow:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
/* board */
.board{background:var(--board);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.board-head span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-family:var(--f-mono);font-weight:500;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 8px}
.tbl th:nth-child(2){text-align:left}
.tbl td{padding:11px 8px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-size:.92rem}
.tbl td.pos{width:2.5rem;text-align:center;font-weight:600;color:var(--muted)}
.tbl td.nm{text-align:left;font-family:var(--f-body);font-weight:600;font-size:1rem;color:var(--cream)}
.tbl td.nm .chev{color:var(--muted);margin-left:4px;font-weight:400}
.tbl td.net{font-weight:600;font-size:1.08rem}
.tbl td.thru{color:var(--muted);font-size:.8rem}
.lbrow{cursor:pointer}
.lbrow:active{background:var(--row)}
tr.lead td.pos{color:var(--bg);background:var(--flag)}
tr.lead td.net{color:var(--flag)}
tr.p2 td.pos{color:#0b1a14;background:#c7d0d4}
tr.p3 td.pos{color:#0b1a14;background:#c98d5a}
td.pos .mv{display:block;font-size:.62rem;line-height:1.1;margin-top:2px;font-weight:600}
td.pos .mv.up{color:var(--green)} td.pos .mv.dn{color:var(--red)}
tr.lead td.pos .mv,tr.p2 td.pos .mv,tr.p3 td.pos .mv{color:#0b1a14}
header p.ctpnote{margin:8px 0 0;display:inline-flex;align-items:center;gap:6px;width:fit-content;padding:5px 10px;border-radius:999px;border:1px solid var(--flag);color:var(--flag);font-size:.82rem;font-weight:600}
.hole.ctp{border-color:var(--flag);box-shadow:inset 3px 0 0 var(--flag)}
.hole .ctpb{display:inline-block;margin-top:2px;font-size:.72rem;font-weight:600;color:var(--flag);text-transform:uppercase;letter-spacing:.06em}
.strip th.ctp{color:var(--flag);background:color-mix(in srgb,var(--flag) 18%,var(--board))}
tr.empty td{color:var(--muted)} tr.empty td.nm{color:var(--muted);font-weight:500}
tr.moved{animation:flash 1.2s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--flag) 25%,transparent)}to{background:transparent}}
.sync{font-weight:600;color:var(--muted)} .sync.live{color:var(--green)}
.board-foot{padding:8px 14px;font-size:.75rem;color:var(--muted);border-top:1px solid var(--line)}
.under{color:var(--green)} .over{color:var(--red)}
.links{display:flex;gap:8px;margin-top:14px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--flag);color:var(--bg)}
.btn.sec{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:var(--bg)}
/* top bar for inner views */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar .back{background:transparent;border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:8px 12px;font-weight:600}
.bar .ttl{flex:1;min-width:0}
.bar .ttl h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .ttl .tform{margin:2px 0 3px;font-style:italic;font-size:.84rem;line-height:1.3;color:var(--cream)}
.bar .ttl .tform b{font-style:normal;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--flag);margin-right:4px}
.bar .ttl small{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
/* card summary */
.sum{margin-bottom:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;background:var(--board);border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.sum b{display:block;font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.sum span{font-size:.62rem;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tip{margin-block:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--flag);color:var(--flag);background:color-mix(in srgb,var(--flag) 8%,transparent);font-size:.9rem}
/* strip */
.strip-wrap{overflow:hidden;margin-bottom:12px;border:1px solid var(--line);border-radius:10px}
.strip{border-collapse:collapse;table-layout:fixed;width:100%;font-family:var(--f-mono);font-size:.7rem;font-variant-numeric:tabular-nums}
.strip th,.strip td{padding:5px 0;text-align:center;border-left:1px solid var(--line);overflow:hidden}
.strip .mk{min-width:1.2rem;height:1.2rem}
.strip th:first-child,.strip td:first-child{border-left:0;width:2.6rem;text-align:left;padding-left:6px;color:var(--muted);font-weight:500}
.strip thead th{color:var(--muted);font-weight:500;background:var(--board)}
.strip th:last-child,.strip td:last-child{width:2.2rem}
.strip td.tot{color:var(--cream);font-weight:600;background:var(--board)}
.strip td.s{cursor:pointer}
/* score marks */
.mk{display:inline-grid;place-items:center;min-width:1.5rem;height:1.5rem;line-height:1}
.mk.birdie{border:1.5px solid var(--green);border-radius:50%;color:var(--green)}
.mk.eagle{border:3px double var(--green);border-radius:50%;color:var(--green)}
.mk.bogey{border:1.5px solid var(--muted)}
.mk.dbl{border:3px double var(--red);color:var(--red)}
/* holes */
.nine{display:grid;gap:6px}
.nine h3{font-family:var(--f-display);font-weight:700;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 2px;color:var(--muted)}
.hole{display:grid;grid-template-columns:2.4rem 1fr 4.2rem;gap:10px;align-items:center;background:var(--row);border:1px solid var(--line);border-radius:10px;padding:8px 10px;scroll-margin-top:90px}
.hole .no{font-family:var(--f-display);font-weight:900;font-size:1.6rem;text-align:center;line-height:1}
.hole .info{min-width:0;display:grid;gap:1px}
.hole .info b{font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--flag)}
.hole .info span{font-size:.82rem;color:var(--muted)}
.hole input{font:inherit;font-family:var(--f-mono);font-size:1.3rem;font-weight:600;text-align:center;width:100%;padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--cream)}
.hole input:disabled{background:transparent;border-color:transparent;color:var(--cream);opacity:1;-webkit-text-fill-color:var(--cream)}
.hole input::placeholder{color:#4f6e61}
.subt{display:flex;justify-content:space-between;padding:8px 12px;font-family:var(--f-mono);font-size:.85rem;color:var(--muted);border-top:1px solid var(--line)}
.subt b{color:var(--cream)}
/* setup */
.prow{display:grid;grid-template-columns:1fr 5rem auto;gap:8px;align-items:center;background:var(--row);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.panel{display:grid;gap:8px}
.hint{margin:0 0 4px;color:var(--muted);font-size:.85rem}
.prow input,.add input{font:inherit;font-family:var(--f-mono);font-size:1.1rem;font-weight:600;text-align:center;width:100%;padding:8px 6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--cream)}
input.name{text-align:left;font-family:var(--f-body);font-size:1rem;font-weight:500}
.x{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;min-width:2.4rem;height:2.4rem;font-size:1.1rem}
.x.confirm{color:var(--bg);background:var(--red);border-color:var(--red);padding:0 10px;font-size:.8rem;font-weight:600}
.add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:4px}
@media (prefers-reduced-motion:reduce){tr.moved{animation:none}}
.course{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mode{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);color:var(--muted);background:var(--board)}
.nmw{display:flex;align-items:center;gap:8px;min-width:0}
.av{flex:none;width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--flag);background:var(--row);display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.02em;color:var(--flag);overflow:hidden}
.av.lg{width:52px;height:52px;font-size:1.3rem;border-width:2.5px}
.bar .av.lg{margin-left:2px}
.form{margin:0 0 14px;padding:10px 12px;border-left:3px solid var(--flag);background:var(--board);border-radius:8px;font-style:italic;font-size:.95rem;color:var(--cream)}
.form b{display:block;font-style:normal;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--flag);margin-bottom:2px}
.hole .info b .shot{color:var(--green);font-weight:600;white-space:nowrap}
.scoring{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:.9rem;color:var(--muted)}
.scoring a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--cream);text-decoration:none;font-weight:600}
.scoring a.on{background:var(--flag);border-color:var(--flag);color:var(--bg)}
html.light{color-scheme:light;--bg:#ffffff;--board:#f4f8f5;--row:#ffffff;--line:#d6e3db;--cream:#12271e;--muted:#5b7468;--flag:#b8860b;--red:#c4412e;--green:#1d8a56;--blue:#2f6fae}
html.light .board-head{background:#14322a;border-bottom-color:#14322a}
html.light .board-head h2{color:#fff} html.light .board-head span{color:#b9d3c6}
html.light tr.lead td.pos,html.light .btn{color:#fff}
html.light .btn.sec{color:var(--cream)}
html.light .hole{box-shadow:0 1px 2px rgba(18,39,30,.06)}
html.light .hole input::placeholder{color:#a3b5ab}
.faces{display:flex;flex:none}.faces .av{margin-left:-9px;box-shadow:0 0 0 2px var(--board)}.faces .av:first-child{margin-left:0}
.tm{display:block;min-width:0}.tm small{display:block;font-size:.72rem;line-height:1.25;color:var(--muted);font-weight:500;margin-top:2px}
.faces.sm{margin:4px 0 0}.faces.sm .av{width:24px;height:24px;font-size:.7rem;border-width:1.5px;margin-left:-6px}.faces.sm .av:first-child{margin-left:0}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--cream);font-weight:600}.seg button.on{background:var(--flag);border-color:var(--flag);color:var(--bg)}
.tcard{background:var(--row);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.tcard input.name{font:inherit;font-weight:600;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--cream)}
.tcard .who{font-size:.88rem;color:var(--muted)}
.prow select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--cream);max-width:9.5rem}
.chk{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.chk input{width:1.2rem;height:1.2rem;accent-color:var(--flag)}
.prow.off input.name{opacity:.45}
.sect{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 2px;font-size:1rem}
.note{color:var(--muted);font-size:.9rem;padding:14px;text-align:center}
.prow{grid-template-columns:1fr 4.2rem auto auto}
.prow.assign{grid-template-columns:auto 1fr auto}
.links .btn{flex:1}
.btn.dispute{background:transparent;color:var(--red);border:1px solid var(--red)}
#ruling{position:fixed;inset:0;z-index:60;background:#b3261e;color:#fff;display:grid;place-content:center;gap:18px;padding:24px;text-align:center;cursor:pointer;animation:rul .25s ease-out}

.rul-head{font-family:var(--f-mono);letter-spacing:.2em;text-transform:uppercase;font-size:.85rem;opacity:.85}
.rul-body{font-family:var(--f-display);font-weight:900;font-size:clamp(2.6rem,13vw,5.5rem);line-height:.95;text-transform:uppercase}
.rul-foot{font-size:.9rem;opacity:.85}

.fin-who{min-width:0}.fin-who b{display:block;font-size:1.05rem}.fin-who small{display:block;color:var(--muted);font-size:.78rem}
.pastbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:10px 12px;border-radius:10px;border:1px solid var(--flag);color:var(--flag);background:color-mix(in srgb,var(--flag) 10%,transparent);font-size:.9rem}
.pastbar b{color:var(--cream)}
.pastbar button{flex:none;border:1px solid var(--flag);background:transparent;color:var(--flag);border-radius:8px;padding:7px 10px;font-weight:600}

.evcard b{display:block;font-size:1.05rem}
.evcard span{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.evcard .win{color:var(--flag);font-weight:600}
.scoring button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--cream);background:transparent;font-weight:600;white-space:nowrap}
.scoring button.on{background:var(--flag);border-color:var(--flag);color:var(--bg)}
#evName{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--cream)}
.scoring{flex-wrap:wrap}.scoring span{width:100%;text-align:center}.scoring a{white-space:nowrap}

<script>
/* ============================================================
   CONFIG — paste your two Supabase values here.
   Supabase dashboard > Project Settings > API Keys (older projects: Settings > API):
     SUPABASE_URL      = the Project URL, e.g. "https://abcdefgh.supabase.co"
     SUPABASE_ANON_KEY = the "anon public" key (eyJ...) or the "Publishable" key (sb_publishable_...)
   Leave both blank and the page runs on this phone only.
   ============================================================ */
const SUPABASE_URL="";
const SUPABASE_ANON_KEY="";

/* ============================================================
   STORE — the only place that reads or writes data.
   Live mode: Supabase tables "players" (id, name, hcp, sort) and
   "scores" (player_id, hole, strokes), with realtime so every phone
   updates within a second. Local mode: this phone's browser storage.
   Nothing outside this block touches storage.
   ============================================================ */
/* Test build (test/index.html) sets window.WDDE_TEST: phone-only storage, can delete past events, plays the end-of-round voice. */
const TEST=!!window.WDDE_TEST, PREVIEW=!!window.WDDE_PREVIEW, CAN_DELETE_EVENTS=TEST, END_AUDIO=TEST;
const EVENTS_KEY=PREVIEW?"wdde-golf-preview-events":TEST?"wdde-golf-test-events":"wdde-golf-events";
const STORE_KEY=PREVIEW?"wdde-golf-preview":TEST?"wdde-golf-test":"wdde-golf-v4";  // v4 = clean slate; older saves are wiped
const DEFAULT_NAMES=["AB","Brocky","Don","Gilly","Joey","JT","Locky","Rocket","Shark","Wally"];
const blankHoles=()=>Array(18).fill(null);
let MODE="local", SB=null, syncNote="Saved on this phone only.";
/* Scoring method and theme come from the address: ?s=stableford | ?s=ambrose, &theme=light */
const QS=new URLSearchParams(location.search);
let SCORING=["stroke","stableford","ambrose"].includes(QS.get("s"))?QS.get("s"):"ambrose"; /* the day is Ambrose, so the plain link opens on it */
/* Viewing a saved past event: PAST holds it, the live board is parked in LIVE_STATE until "Back to live". */
let PAST=null, LIVE_STATE=null, LIVE_SCORING=null, EVENTS=null;
const THEME=QS.get("theme")==="light"?"light":"dark";
if(THEME==="light")document.documentElement.classList.add("light");
function href(sc,th){const q=new URLSearchParams();if(sc!=="ambrose")q.set("s",sc);if(th==="light")q.set("theme","light");const x=q.toString();return "./"+(x?"?"+x:"")}
function defaultState(){
  const st={players:DEFAULT_NAMES.map((n,i)=>({id:"p"+(i+1),name:n,hcp:null,sort:i+1,playing:true,holes:blankHoles()})),teams:[],teamSize:3};
  if(TEST){ /* phone-only copies start like the real day: AB sitting out, the three real teams */
    st.players[0].playing=false;

async function fetchAll(){
  const [pl,sc,tm,ts,st]=await Promise.all([
    SB.from("players").select("id,name,hcp,sort,playing").order("sort"),
    SB.from("scores").select("player_id,hole,strokes"),
    SB.from("teams").select("id,name,members,sort").order("sort"),
    SB.from("team_scores").select("team_id,hole,strokes"),
    SB.from("settings").select("key,value")]);
  if(pl.error||sc.error)throw (pl.error||sc.error);
  const players=pl.data.map(r=>({id:r.id,name:r.name,hcp:r.hcp==null?null:Number(r.hcp),sort:r.sort,playing:r.playing!==false,holes:blankHoles()}));
  const by=Object.fromEntries(players.map(p=>[p.id,p]));
  sc.data.forEach(r=>{const p=by[r.player_id];if(p&&r.hole>=1&&r.hole<=18)p.holes[r.hole-1]=r.strokes});
  const teams=(tm.data||[]).map(r=>({id:r.id,name:r.name,members:r.members||[],sort:r.sort||0,holes:blankHoles()}));
  const tby=Object.fromEntries(teams.map(t=>[t.id,t]));
  (ts.data||[]).forEach(r=>{const t=tby[r.team_id];if(t&&r.hole>=1&&r.hole<=18)t.holes[r.hole-1]=r.strokes});
  const sz=(st.data||[]).find(r=>r.key==="team_size");

async function startStore(){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY)return;
  if(!window.supabase){syncNote="Couldn't load the live sync library. Saved on this phone only.";render();return}
  try{
    SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

    MODE="live";syncNote="Live: scores sync across everyone's phones.";
    onRemoteChange(s);
    SB.channel("wdde-golf")
      .on("postgres_changes",{event:"*",schema:"public",table:"scores"},applyScoreEvent)
      .on("postgres_changes",{event:"*",schema:"public",table:"players"},applyPlayerEvent)
      .on("postgres_changes",{event:"*",schema:"public",table:"teams"},applyTeamEvent)
      .on("postgres_changes",{event:"*",schema:"public",table:"team_scores"},applyTeamScoreEvent)
      .on("postgres_changes",{event:"*",schema:"public",table:"settings"},applySettingEvent)
      .subscribe(st=>{if(st==="SUBSCRIBED"){syncNote="Live: scores sync across everyone's phones.";resync()}
        else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"){syncNote="Live connection dropped. Retrying… scores still save.";rerender()}});

function applyScoreEvent(ev){if(PAST){LIVE_DIRTY=true;return}
  const r=ev.eventType==="DELETE"?ev.old:ev.new;const p=state.players.find(x=>x.id===r.player_id);if(!p||!r.hole)return;
  p.holes[r.hole-1]=ev.eventType==="DELETE"?null:r.strokes;rerender();

function applyPlayerEvent(ev){if(PAST){LIVE_DIRTY=true;return}
  if(ev.eventType==="DELETE"){state.players=state.players.filter(p=>p.id!==ev.old.id);rerender();return}
  const r=ev.new;let p=state.players.find(x=>x.id===r.id);
  if(!p){p={id:r.id,holes:blankHoles()};state.players.push(p)}
  p.name=r.name;p.hcp=r.hcp==null?null:Number(r.hcp);p.sort=r.sort;p.playing=r.playing!==false;
  state.players.sort((a,b)=>(a.sort||0)-(b.sort||0));rerender();

const timers={};
function debounce(key,fn,ms=400){clearTimeout(timers[key]);timers[key]=setTimeout(fn,ms)}
/* Writes retry until they land (patchy signal on the course). A newer edit to the same box replaces an older pending one. */
const pending={};
const LIVE_NOTE="Live: scores sync across everyone's phones.";
function persist(key,meta,op){
  const ver=(pending[key]?pending[key].ver:0)+1; pending[key]=Object.assign({ver},meta);
  (async()=>{
    for(;;){
      if(!pending[key]||pending[key].ver!==ver)return;
      let error=null; try{({error}=await op())}catch(e){error=e}
      if(!error){
        if(pending[key]&&pending[key].ver===ver)delete pending[key];
        if(!Object.keys(pending).length&&!syncNote.startsWith("Live")){syncNote=LIVE_NOTE;rerender()}
        return;
      }
      syncNote="No signal? Your scores are kept on this phone and will send by themselves.";rerender();
      await new Promise(r=>setTimeout(r,4000));
    }
  })();
}
function warn(e){if(e){syncNote="Last change didn't reach the live board. Check signal and try again.";rerender()}}

const SI=[5,17,7,15,1,9,13,11,3,16,18,2,6,14,4,12,8,10];
/* Handicap strokes on hole i: a 12 gets one shot on index 1-12; a 20 gets one everywhere plus a second on index 1-2. Handicap rounds to a whole number. */
function shots(hcp,i){
  const h=Math.round(hcp||0), n=Math.abs(h), base=Math.floor(n/18), extra=n%18;
  if(h>=0)return base+(SI[i]<=extra?1:0);
  return -(base+(SI[i]>18-extra?1:0)); /* plus handicap gives shots back on the easiest holes */
}

/* Stableford: net par = 2 points, +1 per shot better, -1 per shot worse, never below 0. */
function holePts(holes,hcp,i){const v=holes[i];return v==null?null:Math.max(0,2+PAR[i]-(v-shots(hcp,i)))}
const playingPlayers=()=>state.players.filter(p=>p.playing!==false);

function teamMembers(t){return (t.members||[]).map(id=>state.players.find(p=>p.id===id)).filter(p=>p&&p.playing!==false)}

const AMBROSE_HCP=false;
function teamHcp(t){if(!AMBROSE_HCP)return 0;const m=teamMembers(t);if(!m.length)return 0;return Math.round(m.reduce((a,p)=>a+(p.hcp||0),0)/(2*m.length)*10)/10}
function stats(p){return statsFor(p.holes,p.hcp)}
function statsFor(holes,hcp){
  const p={holes,hcp};
  const played=p.holes.map((v,i)=>v!=null?i:-1).filter(i=>i>=0);
  const gross=played.length?sum(p.holes,0,18):null;
  const parPlayed=played.reduce((s,i)=>s+PAR[i],0);
  /* Net to par: handicap strokes are taken on the holes played, by stroke index, as on a real card. */
  const netExact=gross==null?null:gross-parPlayed-played.reduce((s,i)=>s+shots(p.hcp,i),0);
  return{thru:played.length,gross,toPar:gross==null?null:gross-parPlayed,netExact,net:netExact==null?null:Math.round(netExact),pts:played.reduce((s,i)=>s+holePts(holes,hcp,i),0)};
}

  return `<span class="mk ${c}">${score}</span>`;
}

const teamScoring=()=>state.teams.some(t=>(t.members||[]).length&&t.holes.some(v=>v!=null));

function ensureTeams(n){
  for(let k=1;k<=n;k++){const id="t"+k;if(!state.teams.find(t=>t.id===id)){const t={id,name:"Team "+k,members:[],sort:k,holes:blankHoles()};state.teams.push(t);saveTeam(t)}}

function teamCount(){return Math.max(1,Math.ceil(playingPlayers().length/(state.teamSize||3)))}
/* Even teams: snake draft by handicap (best with worst). Random: shuffle, then deal out. */
function autoTeams(random){
  const n=teamCount();ensureTeams(n);
  let ps=playingPlayers().slice();
  if(random){for(let i=ps.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ps[i],ps[j]]=[ps[j],ps[i]]}}
  else ps.sort((a,b)=>(a.hcp??99)-(b.hcp??99));
  const pick=state.teams.filter(t=>+t.id.slice(1)<=n).sort((a,b)=>a.sort-b.sort);
  state.teams.forEach(t=>t.members=[]);
  const best=random?null:bestSplit(ps,n,state.teamSize||3);
  if(best)best.forEach((g,k)=>g.forEach(p=>pick[k].members.push(p.id)));
  else ps.forEach((p,i)=>{const r=Math.floor(i/n),c=i%n;pick[random||r%2===0?c:n-1-c].members.push(p.id)});
  state.teams.forEach(saveTeam);
}
/* Try every way to split the players into teams and keep the one whose team handicaps are closest together.
   Fine for a golf day (9 players = 280 splits); falls back to the snake draft if it would take too long. */
function bestSplit(ps,n,size){
  const base=Math.floor(ps.length/n),extra=ps.length%n,sizes=Array.from({length:n},(_,k)=>base+(k<extra?1:0)); /* 9 players in teams of 4 = 3+3+3, not 4+4+1 */
  if(!base||ps.length>12)return null;
  const th=g=>g.reduce((a,p)=>a+(p.hcp||0),0)/(2*g.length);
  let best=null,bestSpread=Infinity,tries=0;
  const groups=sizes.map(()=>[]);
  (function place(i){
    if(++tries>200000)return;
    if(i===ps.length){const h=groups.map(th),spread=Math.max(...h)-Math.min(...h);if(spread<bestSpread-1e-9){bestSpread=spread;best=groups.map(g=>g.slice())}return}
    for(let k=0;k<n;k++){
      if(groups[k].length>=sizes[k])continue;
      if(groups[k].length===0&&groups.slice(0,k).some(g=>g.length===0&&sizes[groups.indexOf(g)]===sizes[k]))continue; /* skip mirror-image splits */
      groups[k].push(ps[i]);place(i+1);groups[k].pop();
    }
  })(0);
  return best;
}

/* ---------- end-of-day finale (test build) ----------
   When the last outstanding score of the day goes in, that phone reads out third, second and first

const CLIP_BASE=window.WDDE_AUDIO_BASE||((TEST?"":"test/")+"audio/announce/");
let AC=null; const CLIPS={};
function audioCtx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==="suspended")AC.resume();return AC}
function clip(name){
  if(!CLIPS[name])CLIPS[name]=fetch(CLIP_BASE+name+".mp3").then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>new Promise((ok,no)=>audioCtx().decodeAudioData(b,ok,no))).catch(()=>null);
  return CLIPS[name];
}
if(END_AUDIO){["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{if(audioCtx())["intro","third","third_last","second","first","win_team","win_one","and"].forEach(clip)},{passive:true}))}
const nameClip=n=>"name_"+String(n||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function placeGroups(st){const g=[];st.forEach(x=>{const last=g[g.length-1];if(last&&last[0].pos===x.pos)last.push(x);else g.push([x])});return g}
function peopleOf(group){return group.flatMap(x=>x.team?teamMembers(x.p).map(m=>m.name):[x.p.name])}

async function playSeq(list){
  const ctx=audioCtx();if(!ctx)return;
  const bufs=await Promise.all(list.map(x=>x==="PAUSE"?null:clip(x)));
  let t=ctx.currentTime+0.15;
  list.forEach((x,i)=>{if(x==="PAUSE"){t+=0.5;return}const b=bufs[i];if(!b)return;const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(t);t+=b.duration+0.06});
}
function finaleSeq(st){
  const g=placeGroups(st);if(!g.length)return[];
  const seq=["intro","PAUSE"];
  if(g[2]){seq.push(g.length===3?"third_last":"third",...namesSeq(peopleOf(g[2])),"PAUSE")}
  if(g[1]){seq.push("second",...namesSeq(peopleOf(g[1])),"PAUSE")}
  const winners=peopleOf(g[0]);
  seq.push("first",...namesSeq(winners),"PAUSE",winners.length>1?"win_team":"win_one");
  return seq;
}

/* Test helper: a full pretend day up to hole 16, so the last holes can be played out on a phone. */
function loadDemo(){
  const H={p2:18,p3:4,p4:11,p5:6,p6:22,p7:16,p8:25,p9:12,p10:20};
  let seed=7;const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648};
  const score=(par,hcp)=>{const r=rnd(),d=r<.12?-1:r<.5-hcp*.008?0:r<.82?1:r<.95?2:3;return Math.max(2,par+d)};
  state.players.forEach(p=>{p.playing=p.id!=="p1";if(H[p.id]!=null)p.hcp=H[p.id];p.holes=blankHoles();if(p.playing)for(let i=0;i<16;i++)p.holes[i]=score(PAR[i],p.hcp||0)});
  state.teamSize=3;ensureTeams(3);const DAY={t1:["p3","p4","p8"],t2:["p7","p6","p2"],t3:["p9","p10","p5"]}; /* the real teams for 16 Oct */
  state.teams.forEach(t=>{t.members=DAY[t.id]||[]});
  state.teams.forEach(t=>{t.holes=blankHoles();if(teamMembers(t).length)for(let i=0;i<16;i++)t.holes[i]=Math.max(2,PAR[i]+(rnd()<.3?-1:rnd()<.8?0:1))});
  FINALE_SHOWN=false;saveLocal();go("board");

  const any=state.players.some(p=>p.holes.some(v=>v!=null))||state.teams.some(t=>t.holes.some(v=>v!=null));
  if(any){
    const row={id:"e"+Date.now().toString(36),name,played_on:new Date().toLocaleDateString("en-CA"),data:snapshot()};
    if(MODE==="live"){
      let error=null;try{({error}=await SB.from("events").insert(row))}catch(e){error=e}
      if(error){syncNote="Couldn't save to Past events, so nothing was cleared. Check signal and try again.";EVENTS=null;go("board");return}
    }else{try{const k=EVENTS_KEY;const a=JSON.parse(localStorage.getItem(k)||"[]");a.unshift(row);localStorage.setItem(k,JSON.stringify(a))}catch(e){}}
    EVENTS=null;
  }
  state.players.forEach(p=>{if(p.hcp!=null){p.hcp=null;savePlayer(p)}});
  await clearAllScores();
  go(any?"past":"board");
}
async function loadEvents(){
  if(MODE==="live"){
    const{data,error}=await SB.from("events").select("id,name,played_on,created_at,data").order("played_on",{ascending:false}).order("created_at",{ascending:false});
    EVENTS=error?[]:data;
  }else{try{EVENTS=JSON.parse(localStorage.getItem(EVENTS_KEY)||"[]")}catch(e){EVENTS=[]}}
  if(view.name==="past")render();
}
function standings(st,mode){
  const s0=state;state=st;
  try{
    const amb=mode==="ambrose",sf=mode==="stableford";
    const list=amb?activeTeams().map(t=>Object.assign({p:t,team:true},statsFor(t.holes,teamHcp(t))))
                  :playingPlayers().map(p=>Object.assign({p},stats(p)));
    const out=list.filter(x=>x.gross!=null).sort((a,b)=>sf?(b.pts-a.pts||a.thru-b.thru):(a.net-b.net||a.netExact-b.netExact||b.thru-a.thru));
    const key=x=>sf?-x.pts:x.net;let pos=0,last=null;out.forEach((x,i)=>{if(key(x)!==last){pos=i+1;last=key(x)}x.pos=pos}); /* ties share a place */
    return out;
  }finally{state=s0}
}
function renderPastList(){
  if(EVENTS==null)loadEvents();
  $("app").innerHTML=`
  <div class="bar"><button class="back" data-go="board" type="button">‹ Leaderboard</button><div class="ttl"><h2>Past events</h2><small>Saved when someone taps “Save to Past events &amp; clear”</small></div></div>
  <section class="panel">
    ${EVENTS==null?`<p class="note">Loading…</p>`:!EVENTS.length?`<p class="note">No past events yet. At the end of a day, go to <b>Handicaps &amp; players</b> and tap <b>Save to Past events &amp; clear</b>.</p>`
    :EVENTS.map(ev=>{const m=ev.data.scoring||"stroke",w=standings(ev.data,m)[0];
      const res=w?`${esc(w.p.name)} (${m==="stableford"?w.pts+" pts":toParTxt(w.net)+" net"})`:"no scores";
      return `<button class="evcard" type="button" data-event="${ev.id}"><b>${esc(ev.name)}</b><span>${fmtDate(ev.played_on)} · ${FORMAT_NAME[m]}</span><span class="win">Winner: ${res}</span></button>`}).join("")}
  </section>`;
}
function openPast(id){
  const ev=(EVENTS||[]).find(x=>x.id===id);if(!ev)return;
  LIVE_STATE=state;LIVE_SCORING=SCORING;PAST=ev;
  const d=JSON.parse(JSON.stringify(ev.data));d.teams=d.teams||[];d.players.forEach(p=>{p.holes=p.holes||blankHoles()});d.teams.forEach(t=>{t.holes=t.holes||blankHoles()});
  state=d;SCORING=d.scoring||"stroke";view={name:"board",id:null,edit:false};render();window.scrollTo(0,0);
}
async function deletePast(){
  const id=PAST.id;
  if(MODE==="live"){const{error}=await SB.from("events").delete().eq("id",id);if(error){syncNote="Couldn't delete that event.";render();return}}
  else{try{localStorage.setItem(EVENTS_KEY,JSON.stringify((JSON.parse(localStorage.getItem(EVENTS_KEY)||"[]")).filter(e=>e.id!==id)))}catch(e){}}
  EVENTS=null;go("past");
}
function closePast(){
  if(!PAST)return;
  state=LIVE_STATE;SCORING=LIVE_SCORING;PAST=null;LIVE_STATE=null;
  view={name:"board",id:null,edit:false};render();window.scrollTo(0,0);
  if(LIVE_DIRTY){LIVE_DIRTY=false;resync()}
}

/* ---------- events ---------- */
function go(name,id){if(name==="past"&&PAST){state=LIVE_STATE;SCORING=LIVE_SCORING;PAST=null;LIVE_STATE=null;if(LIVE_DIRTY){LIVE_DIRTY=false;resync()}}view={name,id:id||null,edit:false};render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const o=e.target.closest("[data-open]");if(o){go("card",o.dataset.open);return}
  const tm=e.target.closest("[data-team]");if(tm){go("team",tm.dataset.team);return}
  if(e.target.closest("#dispute")){let el=$("ruling");if(!el){el=document.createElement("div");el.id="ruling";el.setAttribute("role","alertdialog");document.body.appendChild(el)}
    el.innerHTML=`<div class="rul-head">Official ruling</div><div class="rul-body">FUCK OFF, YOU WHINGING CUNT!!</div><div class="rul-foot">Dispute dismissed. Tap anywhere to return.</div>`;el.hidden=false;return}
  if(e.target.closest("#ruling")){$("ruling").hidden=true;return}
  if(e.target.closest("[data-closepast]")){closePast();return}
  if(e.target.id==="delEvent"){const b=e.target;if(!b.dataset.armed){b.dataset.armed="1";b.className="btn danger";b.textContent="Tap again to delete for good";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.className="btn sec";b.textContent="Delete this event"}},3000);return}deletePast();return}
  const pm=e.target.closest("[data-pastmode]");if(pm){SCORING=pm.dataset.pastmode;render();return}
  const ev=e.target.closest("[data-event]");if(ev){openPast(ev.dataset.event);return}
  const sz=e.target.closest("[data-size]");if(sz&&teamScoring())return;if(sz){state.teamSize=+sz.dataset.size;saveSetting("team_size",state.teamSize);render();return}
  if((e.target.id==="autoTeams"||e.target.id==="randTeams")&&teamScoring())return;
  if(e.target.id==="autoTeams"){autoTeams(false);render();return}
  if(e.target.id==="randTeams"){autoTeams(true);render();return}
  const j=e.target.closest("[data-jump]");if(j){const el=$("hole-"+j.dataset.jump);if(el){el.scrollIntoView({behavior:"smooth",block:"start"});el.querySelector("input").focus({preventScroll:true})}return}
  const d0=e.target.closest("[data-del]");if(d0&&inATeam(d0.dataset.del))return;
  const d=e.target.closest("[data-del]");
  if(d){
    if(!d.classList.contains("confirm")){d.classList.add("confirm");d.textContent="Remove";setTimeout(()=>{if(d.isConnected){d.classList.remove("confirm");d.textContent="×"}},3000);return}
    const id=d.dataset.del;state.players=state.players.filter(p=>p.id!==id);removePlayerFromStore(id);render();return}
  if(e.target.id==="clearAll"&&teamScoring()&&!teamsFinished())return;
  if(e.target.id==="clearAll"){
    const b=e.target;
    if(!b.dataset.armed){b.dataset.armed="1";b.className="btn danger";b.textContent="Tap again to save & clear";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.className="btn sec";b.textContent="Save to Past events & clear"}},3000);return}
    b.disabled=true;b.textContent="Saving…";finishEvent(($("evName").value||"Golf day").trim());
  }
});
document.addEventListener("keydown",e=>{const o=e.target.closest&&e.target.closest("[data-open],[data-team]");if(o&&(e.key==="Enter"||e.key===" ")){e.preventDefault();o.dataset.team?go("team",o.dataset.team):go("card",o.dataset.open)}});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.assign&&teamScoring()){render();return}
  if(el.dataset.assign){assign(el.dataset.assign,el.value);render();return}
  if(el.dataset.play&&inATeam(el.dataset.play)){render();return}
  if(el.dataset.play){const p=state.players.find(x=>x.id===el.dataset.play);if(p){p.playing=el.checked;savePlayer(p);render()}}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(PAST)return;
  if(el.dataset.hole!=null&&view.name==="card"){
    const p=state.players.find(x=>x.id===view.id),i=+el.dataset.hole;
    p.holes[i]=num(el.value);saveHole(p,i);
    finaleCheck(true);
    if(el.value.length>=1&&p.holes[i]!=null&&p.holes[i]>1&&i<17){const nx=$(`s-${p.id}-${i+1}`);if(nx&&!nx.value)setTimeout(()=>nx.focus(),50)}
    refreshCardNumbers();return;
  }
  if(el.dataset.thole!=null&&view.name==="team"){
    const t=state.teams.find(x=>x.id===view.id),i=+el.dataset.thole;
    t.holes[i]=num(el.value);saveTeamHole(t,i);
    finaleCheck(true);
    if(el.value.length>=1&&t.holes[i]!=null&&t.holes[i]>1&&i<17){const nx=$(`ts-${t.id}-${i+1}`);if(nx&&!nx.value)setTimeout(()=>nx.focus(),50)}
    rerender();return;
  }
  if(el.dataset.tname){const t=state.teams.find(x=>x.id===el.dataset.tname);if(t){t.name=el.value;saveTeam(t)}return}
  if(el.dataset.play||el.dataset.assign)return;
  const id=el.dataset.id,f=el.dataset.f;if(!id||!f)return;
  const p=state.players.find(x=>x.id===id);if(!p)return;
  p[f]=f==="name"?el.value:numDec(el.value);savePlayer(p);});
document.addEventListener("submit",e=>{
  if(e.target.id!=="addForm")return;e.preventDefault();
  const n=$("newName").value.trim();if(!n)return;
  const p={id:"p"+Date.now().toString(36),name:n,hcp:null,holes:blankHoles()};
  state.players.push(p);addPlayer(p);render();$("newName").focus();
});
function refreshCardNumbers(){rerender()}
function rerender(){
  const a=document.activeElement, id=a&&a.id&&a.tagName==="INPUT"?a.id:null, val=id?a.value:null, y=window.scrollY;
  render();window.scrollTo(0,y);
  finaleCheck(false);
  if(id){const el=$(id);if(el){el.value=val;el.focus({preventScroll:true})}}
}
render();startStore();
</script>

</body></html>
